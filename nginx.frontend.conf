server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional same-origin API proxy (useful when VITE_API_URL is empty / relative)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        # FastAPI redirect_slashes Location is http://host/api-keys/ (no /api, http).
        # Rewrite so browsers stay on https + /api prefix.
        proxy_redirect ~^https?://[^/]+/(.*)$ $scheme://$http_host/api/$1;
        proxy_redirect / /api/;
    }

    location /backend/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /backend;
        proxy_redirect ~^https?://[^/]+/(.*)$ $scheme://$http_host/backend/$1;
        proxy_redirect / /backend/;
    }
}
