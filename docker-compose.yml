# Elestio / swarm-master — root entrypoint (no nested docker/ paths)
# UI :3000  API :8000

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: swarm-trader-backend:strategies-ux-7
    container_name: swarm-trader-backend
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-OpenRouter}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-openai/gpt-4o-mini}
      ALPACA_TRADING_MODE: ${ALPACA_TRADING_MODE:-paper}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-sip}
      ALPACA_DATA_URL: ${ALPACA_DATA_URL:-https://data.alpaca.markets}
      GIT_SHA: ${GIT_SHA:-}
      IMAGE_TAG: strategies-ux-7
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://swarm-master-u73408.vm.elestio.app}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - swarm_data:/app/data
      - swarm_cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: swarm-trader-frontend:strategies-ux-7
    container_name: swarm-trader-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  swarm_data:
  swarm_cache:
