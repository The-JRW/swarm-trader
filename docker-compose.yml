# Elestio / swarm-master — root entrypoint (no nested docker/ paths)
# UI :3000  API :8000

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        IMAGE_TAG: strategies-ux-14
    image: swarm-trader-backend:strategies-ux-14
    container_name: swarm-trader-backend
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-OpenRouter}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-openai/gpt-4o-mini}
      ALPACA_TRADING_MODE: ${ALPACA_TRADING_MODE:-paper}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-sip}
      ALPACA_DATA_URL: ${ALPACA_DATA_URL:-https://data.alpaca.markets}
      GIT_SHA: ${GIT_SHA:-unknown}
      IMAGE_TAG: strategies-ux-14
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      SWARM_CRON_SECRET: ${SWARM_CRON_SECRET:-}
      SWARM_MONITOR_DRY_RUN: ${SWARM_MONITOR_DRY_RUN:-true}
      SWARM_AUTO_LAUNCH: ${SWARM_AUTO_LAUNCH:-false}
      SWARM_CRON_EXECUTE_TRADES: ${SWARM_CRON_EXECUTE_TRADES:-false}
      # Wave F — HIT (High-frequency Intraday Turnover). Paper-only default.
      SWARM_HIT_EXECUTE: ${SWARM_HIT_EXECUTE:-false}
      SWARM_HIT_COST_GATE_BPS: ${SWARM_HIT_COST_GATE_BPS:-15}
      SWARM_HIT_TURNOVER_BUDGET_PCT: ${SWARM_HIT_TURNOVER_BUDGET_PCT:-200}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://swarm-master-u73408.vm.elestio.app}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - swarm_data:/app/data
      - swarm_cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: swarm-trader-frontend:strategies-ux-14
    container_name: swarm-trader-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  swarm_data:
  swarm_cache:
